# REFERENCE ONLY – equivalent plain-Nginx server block, for servers not managed
# by RunCloud. On the RunCloud server use runcloud-location.main-before.conf and
# let RunCloud manage the server block and Let's Encrypt certificate.
server {
    listen 443 ssl http2;
    server_name ai.akaunsimple.my;

    ssl_certificate     /etc/letsencrypt/live/ai.akaunsimple.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.akaunsimple.my/privkey.pem;

    root /home/akaunai/apps/akaun-simple-ai/current/apps/excel-addin/dist;
    index taskpane.html;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/akaun-simple-ai-locations.conf; # contents = runcloud-location.main-before.conf

    location / {
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name ai.akaunsimple.my;
    return 301 https://$host$request_uri;
}
