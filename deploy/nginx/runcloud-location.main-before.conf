# RunCloud NGINX config (type: location.main-before) for the web app serving
# ai.akaunsimple.my. Add via RunCloud → Web Application → NGINX Config.
# RunCloud stores it under /etc/nginx-rc/extra.d/ – do NOT edit main nginx files.
#
# The web app's public path must point to:
#   /home/akaunai/apps/akaun-simple-ai/current/apps/excel-addin/dist
# (RunCloud "Native NGINX" or "NGINX + Custom config" stack; PHP not required.)

# ---- API: reverse proxy to the Node service bound on localhost ----
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 200s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    # Never cache API responses
    add_header Cache-Control "no-store" always;
}

# ---- Task pane static files ----
location = /taskpane.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Office loads the task pane in an iframe/webview; do not set X-Frame-Options DENY here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com https://*.office.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors https://*.office.com https://*.office365.com https://*.officeapps.live.com https://*.microsoft.com 'self';" always;
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
